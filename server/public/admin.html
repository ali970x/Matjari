<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matjari Admin</title>
  <style>
    :root {
      --blue: #1769d2;
      --soft-blue: #e8f2ff;
      --ink: #202124;
      --muted: #5f6368;
      --line: #dfe3e8;
      --surface: #f7f9fc;
      --danger: #b3261e;
      font-family: Inter, Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--surface);
      color: var(--ink);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
    }

    h2 {
      font-size: 18px;
      font-weight: 800;
    }

    main {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }

    section {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      padding: 0 18px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      background: var(--blue);
      color: #fff;
    }

    button.secondary {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--blue);
    }

    button.danger {
      border: 1px solid #f1c0bd;
      background: #fff;
      color: var(--danger);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .status {
      min-height: 44px;
      display: flex;
      align-items: center;
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--soft-blue);
      color: #0b4fa8;
      font-weight: 700;
    }

    .status.error {
      background: #fceeee;
      color: var(--danger);
    }

    .hidden {
      display: none;
    }

    .mono {
      font-family: Consolas, "Roboto Mono", monospace;
      font-size: 12px;
    }

    .app-list {
      display: grid;
      gap: 8px;
      max-height: 420px;
      overflow: auto;
      padding-right: 2px;
    }

    .app-card {
      width: 100%;
      min-height: auto;
      display: grid;
      gap: 4px;
      justify-items: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
      text-align: left;
    }

    .app-card.active {
      border-color: var(--blue);
      background: var(--soft-blue);
    }

    .app-card strong {
      font-size: 14px;
    }

    .muted {
      color: var(--muted);
    }

    .check-row {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .check-row label {
      display: inline-flex;
      grid-template-columns: none;
      align-items: center;
      gap: 8px;
    }

    .check-row input {
      width: 18px;
      min-height: 18px;
    }

    @media (max-width: 820px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        padding: 16px;
      }

      .grid,
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Matjari Admin</h1>
    <div id="health" class="mono">Checking API...</div>
  </header>

  <main class="grid">
    <section class="stack">
      <h2>Admin login</h2>
      <label>
        Username
        <input id="username" autocomplete="username" value="admin">
      </label>
      <label>
        Password
        <input id="password" autocomplete="current-password" type="password">
      </label>
      <button id="loginButton">Login</button>
      <div id="loginStatus" class="status">Not signed in</div>

      <div id="appTools" class="stack hidden">
        <div class="toolbar">
          <h2>Existing apps</h2>
          <button id="reloadApps" class="secondary">Reload</button>
        </div>
        <div id="appsList" class="app-list"></div>
      </div>
    </section>

    <section id="workspace" class="stack hidden">
      <h2 id="formTitle">Create app</h2>

      <div class="row">
        <label>
          App name
          <input id="appName" placeholder="Example App">
        </label>
        <label>
          Package name
          <input id="packageName" placeholder="com.matjari.example">
        </label>
      </div>

      <label>
        Description
        <textarea id="description"></textarea>
      </label>

      <div class="row">
        <label>
          Category
          <select id="category"></select>
        </label>
        <label>
          Subcategory
          <select id="subcategory"></select>
        </label>
      </div>

      <div class="row">
        <label>
          Version
          <input id="versionName" value="1.0.0">
        </label>
        <label>
          Build
          <input id="versionCode" type="number" min="1" value="1">
        </label>
      </div>

      <label>
        Size
        <input id="size" value="Unknown">
      </label>

      <div class="check-row">
        <label>
          <input id="isActive" type="checkbox" checked>
          Active
        </label>
        <label>
          <input id="forceUpdate" type="checkbox">
          Force update
        </label>
      </div>

      <h2>Uploads</h2>
      <div class="row">
        <label>
          Icon
          <input id="iconFile" type="file" accept="image/*">
        </label>
        <label>
          APK / file
          <input id="appFile" type="file">
        </label>
      </div>
      <label>
        Screenshots
        <input id="screenshotsFile" type="file" accept="image/*" multiple>
      </label>

      <div class="toolbar">
        <button id="uploadIcon" class="secondary">Upload icon</button>
        <button id="uploadFile" class="secondary">Upload APK</button>
        <button id="uploadScreenshots" class="secondary">Upload screenshots</button>
      </div>

      <label>
        Icon URL
        <input id="iconUrl">
      </label>
      <label>
        APK / file URL
        <input id="fileUrl">
      </label>
      <label>
        Screenshot URLs
        <textarea id="screenshotUrls"></textarea>
      </label>

      <div class="toolbar">
        <button id="saveApp">Save app</button>
        <button id="deleteApp" class="danger">Delete</button>
        <button id="resetForm" class="secondary">Reset</button>
      </div>

      <h2>Release update</h2>
      <label>
        Changelog
        <textarea id="releaseChangelog" placeholder="What changed in this build?"></textarea>
      </label>
      <button id="releaseUpdate" class="secondary">Release update from current version fields</button>
      <div id="workspaceStatus" class="status">Ready</div>
    </section>
  </main>

  <script>
    let token = "";
    let categories = [];
    let apps = [];
    let currentAppId = "";

    const $ = (id) => document.getElementById(id);

    function setStatus(id, message, isError = false) {
      const element = $(id);
      element.textContent = message;
      element.classList.toggle("error", isError);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function request(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          ...(options.body instanceof FormData ? {} : { "Content-Type": "application/json" }),
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...(options.headers || {}),
        },
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error?.message || payload.message || "Request failed");
      }
      return payload;
    }

    async function refreshHealth() {
      try {
        const health = await request("/health");
        $("health").textContent = `${health.name} - data: ${health.data_backend}, uploads: ${health.upload_backend}`;
      } catch (error) {
        $("health").textContent = "API offline";
      }
    }

    async function login() {
      setStatus("loginStatus", "Signing in...");
      try {
        const payload = await request("/api/auth/admin-login", {
          method: "POST",
          body: JSON.stringify({
            username: $("username").value.trim() || "admin",
            password: $("password").value,
          }),
        });
        token = payload.token;
        setStatus("loginStatus", `Signed in as ${payload.user.full_name || payload.user.username}`);
        $("workspace").classList.remove("hidden");
        $("appTools").classList.remove("hidden");
        await loadCategories();
        await loadApps();
      } catch (error) {
        setStatus("loginStatus", error.message, true);
      }
    }

    async function loadCategories() {
      const payload = await request("/api/categories");
      categories = payload.categories || [];
      $("category").innerHTML = categories
        .map((item) => `<option value="${item.id}">${item.name} (${item.type})</option>`)
        .join("");
      await loadSubcategories();
    }

    async function loadSubcategories(selectedId = "") {
      const categoryId = $("category").value;
      if (!categoryId) {
        $("subcategory").innerHTML = "";
        return;
      }
      const payload = await request(`/api/subcategories/${categoryId}`);
      $("subcategory").innerHTML = (payload.subcategories || [])
        .map((item) => `<option value="${item.id}">${item.name}</option>`)
        .join("");
      if (selectedId) $("subcategory").value = selectedId;
    }

    async function loadApps() {
      const payload = await request("/api/apps?active=false");
      apps = payload.apps || [];
      renderApps();
    }

    function renderApps() {
      if (!apps.length) {
        $("appsList").innerHTML = '<div class="muted">No apps yet</div>';
        return;
      }

      $("appsList").innerHTML = apps
        .map((app) => `
          <button class="app-card ${app.id === currentAppId ? "active" : ""}" data-app-id="${escapeHtml(app.id)}">
            <strong>${escapeHtml(app.name)}</strong>
            <span class="muted">${escapeHtml(app.package_name)} - ${escapeHtml(app.version_name)} (${escapeHtml(app.version_code)})</span>
          </button>
        `)
        .join("");

      for (const button of document.querySelectorAll(".app-card")) {
        button.addEventListener("click", () => loadApp(button.dataset.appId));
      }
    }

    async function loadApp(appId) {
      const app = apps.find((item) => item.id === appId);
      if (!app) return;

      currentAppId = app.id;
      $("formTitle").textContent = `Edit ${app.name}`;
      $("appName").value = app.name || "";
      $("packageName").value = app.package_name || "";
      $("description").value = app.description || "";
      $("versionName").value = app.version_name || "1.0.0";
      $("versionCode").value = app.version_code || 1;
      $("size").value = app.size || "Unknown";
      $("iconUrl").value = app.icon_url || "";
      $("fileUrl").value = app.file_url || app.apk_file_url || "";
      $("screenshotUrls").value = (app.screenshots || [])
        .map((item) => item.image_url)
        .filter(Boolean)
        .join("\n");
      $("isActive").checked = app.is_active !== false;
      $("forceUpdate").checked = app.is_force_update === true;
      $("releaseChangelog").value = "";

      if (app.category_id) $("category").value = app.category_id;
      await loadSubcategories(app.subcategory_id || "");
      renderApps();
      setStatus("workspaceStatus", `Loaded ${app.name}`);
    }

    async function upload(endpoint, fieldName, inputId, targetId, multiple = false) {
      const input = $(inputId);
      if (!input.files.length) throw new Error("Choose a file first");

      const formData = new FormData();
      for (const file of input.files) formData.append(fieldName, file);

      const payload = await request(endpoint, {
        method: "POST",
        body: formData,
      });

      const urls = multiple
        ? (payload.files || []).map((file) => file.url)
        : [payload.file?.url].filter(Boolean);
      if (!urls.length) throw new Error("Upload completed without URL");

      if (multiple) {
        const existing = $(targetId).value.trim();
        $(targetId).value = [existing, ...urls].filter(Boolean).join("\n");
      } else {
        $(targetId).value = urls[0];
      }

      return urls;
    }

    async function uploadWithStatus(task) {
      setStatus("workspaceStatus", "Uploading...");
      try {
        const urls = await task();
        setStatus("workspaceStatus", `Uploaded ${urls.length} file${urls.length === 1 ? "" : "s"}`);
      } catch (error) {
        setStatus("workspaceStatus", error.message, true);
      }
    }

    async function saveApp() {
      setStatus("workspaceStatus", "Saving app...");
      try {
        const payload = {
          name: $("appName").value.trim(),
          package_name: $("packageName").value.trim(),
          description: $("description").value.trim(),
          platform: "android",
          category_id: $("category").value,
          subcategory_id: $("subcategory").value || null,
          version_name: $("versionName").value.trim(),
          version_code: Number($("versionCode").value || 1),
          size: $("size").value.trim() || "Unknown",
          icon_url: $("iconUrl").value.trim(),
          file_url: $("fileUrl").value.trim(),
          apk_file_url: $("fileUrl").value.trim(),
          screenshot_urls: $("screenshotUrls").value
            .split(/\r?\n|,/)
            .map((line) => line.trim())
            .filter(Boolean),
          is_active: $("isActive").checked,
          is_force_update: $("forceUpdate").checked,
        };

        const result = await request(currentAppId ? `/api/apps/${currentAppId}` : "/api/apps", {
          method: currentAppId ? "PUT" : "POST",
          body: JSON.stringify(payload),
        });
        currentAppId = result.app.id;
        $("formTitle").textContent = `Edit ${result.app.name}`;
        setStatus("workspaceStatus", `Saved ${result.app.name}`);
        await loadApps();
      } catch (error) {
        setStatus("workspaceStatus", error.message, true);
      }
    }

    async function deleteCurrentApp() {
      if (!currentAppId) {
        setStatus("workspaceStatus", "Choose an app first", true);
        return;
      }

      const appName = $("appName").value.trim() || "this app";
      if (!confirm(`Delete ${appName}?`)) return;

      setStatus("workspaceStatus", "Deleting app...");
      try {
        await request(`/api/apps/${currentAppId}`, { method: "DELETE" });
        resetForm();
        await loadApps();
        setStatus("workspaceStatus", `Deleted ${appName}`);
      } catch (error) {
        setStatus("workspaceStatus", error.message, true);
      }
    }

    async function releaseCurrentUpdate() {
      if (!currentAppId) {
        setStatus("workspaceStatus", "Choose an app first", true);
        return;
      }

      setStatus("workspaceStatus", "Releasing update...");
      try {
        await request(`/api/apps/${currentAppId}/update`, {
          method: "POST",
          body: JSON.stringify({
            version_name: $("versionName").value.trim(),
            version_code: Number($("versionCode").value || 1),
            file_url: $("fileUrl").value.trim(),
            is_force_update: $("forceUpdate").checked,
            changelog: $("releaseChangelog").value.trim(),
          }),
        });
        await loadApps();
        setStatus("workspaceStatus", `Released ${$("versionName").value.trim()}`);
      } catch (error) {
        setStatus("workspaceStatus", error.message, true);
      }
    }

    function resetForm() {
      currentAppId = "";
      $("formTitle").textContent = "Create app";
      for (const id of [
        "appName",
        "packageName",
        "description",
        "iconUrl",
        "fileUrl",
        "screenshotUrls",
      ]) {
        $(id).value = "";
      }
      $("versionName").value = "1.0.0";
      $("versionCode").value = "1";
      $("size").value = "Unknown";
      $("isActive").checked = true;
      $("forceUpdate").checked = false;
      $("releaseChangelog").value = "";
      renderApps();
      setStatus("workspaceStatus", "Ready");
    }

    $("loginButton").addEventListener("click", login);
    $("category").addEventListener("change", () => loadSubcategories());
    $("reloadApps").addEventListener("click", loadApps);
    $("uploadIcon").addEventListener("click", () =>
      uploadWithStatus(() => upload("/api/uploads/icon", "icon", "iconFile", "iconUrl")),
    );
    $("uploadFile").addEventListener("click", () =>
      uploadWithStatus(() => upload("/api/uploads/app-file", "file", "appFile", "fileUrl")),
    );
    $("uploadScreenshots").addEventListener("click", () =>
      uploadWithStatus(() =>
        upload("/api/uploads/screenshots", "screenshots", "screenshotsFile", "screenshotUrls", true),
      ),
    );
    $("saveApp").addEventListener("click", saveApp);
    $("deleteApp").addEventListener("click", deleteCurrentApp);
    $("releaseUpdate").addEventListener("click", releaseCurrentUpdate);
    $("resetForm").addEventListener("click", resetForm);

    refreshHealth();
  </script>
</body>
</html>
